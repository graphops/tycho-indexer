{{- $grafana := .Values.grafana | default (dict) -}}
{{- $dashboards := $grafana.dashboards | default (dict) -}}
{{- $operatorDashboards := $grafana.operatorDashboards | default (dict) -}}
{{- $enabled := or (default false $dashboards.enabled) (default false $operatorDashboards.enabled) -}}
{{- if $enabled }}
{{- $dashboardFiles := .Files.Glob "dashboards/*.json" -}}
{{- if eq (len $dashboardFiles) 0 -}}
{{- fail "grafana dashboards are enabled but no dashboards/*.json files were found in the chart" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default (printf "%s-dashboards" (include "tycho-indexer.fullname" .)) $dashboards.configMap.name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tycho-indexer.labels" . | nindent 4 }}
    {{- with $dashboards.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ include "tycho-indexer.syncWave" (dict "base" .Values.argoCD.syncWaveBase "offset" -1) | quote }}
    {{- with $dashboards.configMap.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
{{- $dashboardFiles.AsConfig | nindent 2 }}
{{- end }}
